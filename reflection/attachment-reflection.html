<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How Do You Create Connection? — Attachment Style Reflection</title>
  <link rel="stylesheet" href="../shared/questionnaire.css" inline>
  <style>
    body { background: var(--page-gradient); }
    .q-main { padding-top: 40px; }
  </style>
  <!-- palette-picker (TEMPORARY): apply saved theme before paint to avoid a flash -->

</head>
<body>

  <header class="q-header">
    <a href="https://www.piatorp.dk" class="q-site-link">&larr; piatorp.dk</a>
  </header>

  <main class="q-main">
    <div id="app" class="q-container"></div>
  </main>

  <script src="attachment-reflection-config.js" inline></script>
  <script src="../shared/questionnaire-framework.js" inline></script>
  <script>
    var q = new Questionnaire(REFLECTION_CONFIG);
    q.mount('app');
  </script>

  <!-- palette-picker (TEMPORARY) — remove with its <head> snippet when colours are locked in -->
  <script src="../shared/palette-picker.js" inline></script>

</html>
