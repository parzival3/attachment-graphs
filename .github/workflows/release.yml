name: Build and publish release artifact

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Needed to create a release and upload assets.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build single-file HTML
        run: npm run build

      - name: Package build into a zip
        run: |
          cd dist
          zip -j ../attachment-reflection.zip \
            attachment-reflection.html \
            attachment-reflection-results.html
          cd ..
          ls -la attachment-reflection.zip

      - name: Create / update release and attach artifact
        uses: softprops/action-gh-release@v2
        with:
          # For tag pushes this is the tag; for manual runs it defaults to the
          # commit and GitHub creates a release named after it.
          files: attachment-reflection.zip
          generate_release_notes: true
